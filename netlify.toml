[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and TypeScript 7 need a current Node.
  NODE_VERSION = "22"

# Single-page app: every route (/services, /workshop, /work, /contact) is served by index.html
# so direct visits and refreshes work. Real files (assets, images, models) are served as-is first.
# Netlify Forms still receives the contact form POST: the form is declared in index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints everything in /assets, so it can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
