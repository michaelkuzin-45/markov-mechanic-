<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060607" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Markov Automotive — enthusiast mechanical shop in Springfield, Virginia: maintenance, diagnostics, brakes + suspension, turbo systems and performance installs."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Inter:wght@300..600&display=swap"
      rel="stylesheet"
    />
    <!-- Hero poster frame: start fetching before the app boots (one per orientation) -->
    <link rel="preload" as="image" href="/hero-clean/desktop/frame_000.webp" type="image/webp" media="(min-aspect-ratio: 4/5)" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-clean/mobile/frame_000.webp" type="image/webp" media="(max-aspect-ratio: 4/5)" fetchpriority="high" />
    <title>Markov Automotive | Springfield, VA</title>
  </head>
  <body>
    <!-- Netlify Forms detects forms in the built HTML, not in React output. This hidden copy declares
         "service-request"; the visible form (src/sections/contact) posts the same fields to "/". -->
    <form name="service-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="service-request" />
      <input name="bot-field" />
      <input name="name" />
      <input name="phone" />
      <input name="email" />
      <input name="year" />
      <input name="make" />
      <input name="model" />
      <select name="service"><option value="Regular Maintenance"></option></select>
      <select name="emergency"><option value="No"></option></select>
      <textarea name="details"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
